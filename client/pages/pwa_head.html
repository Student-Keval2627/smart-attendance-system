<link
    rel="manifest"
    href="{{ url_for('manifest') }}"
>

<meta
    name="theme-color"
    content="#5b8def"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="SmartAttend"
>

<link
    rel="icon"
    type="image/svg+xml"
    href="{{ url_for(
        'static',
        filename='icons/app-icon.svg'
    ) }}"
>

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/pwa.css'
    ) }}"
>

<script
    src="{{ url_for(
        'static',
        filename='js/pwa.js'
    ) }}"
    defer
></script>
