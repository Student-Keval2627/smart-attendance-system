<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Class | SmartAttend</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/delete_confirm.css') }}"
    >
</head>

<body>

    <div class="page-container">

        <!-- ==================================================
             BRAND
        =================================================== -->

        <div class="brand">

            <div class="brand-logo">
                S
            </div>

            <div>
                <h2>SmartAttend</h2>
                <p>College Attendance System</p>
            </div>

        </div>


        <!-- ==================================================
             DELETE CONFIRMATION
        =================================================== -->

        <div class="delete-card">

            <div class="warning-icon">
                !
            </div>


            <span class="small-title">
                DELETE CLASS
            </span>


            <h1>
                Delete {{ class_info["class_name"] }}?
            </h1>


            <p class="description">
                This will permanently delete this class,
                all students inside it and their attendance records.
            </p>


            <!-- CLASS INFORMATION -->

            <div class="info-box">

                <div>

                    <span>
                        Class
                    </span>

                    <strong>
                        {{ class_info["class_name"] }}
                    </strong>

                </div>


                <div>

                    <span>
                        Batch
                    </span>

                    <strong>
                        {{ class_info["batch"] }}
                    </strong>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="actions">

                <a
                    href="{{ url_for('home.home') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>


                <form
                    method="POST"
                    action="{{ url_for(
                        'class_routes.delete_class',
                        class_id=class_info['id']
                    ) }}"
                >

                    <button
                        type="submit"
                        class="delete-btn"
                    >
                        Delete Class
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
