<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartAttend | Offline</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f8fc;
            color: #25324a;
        }

        .offline-card {
            width: 100%;
            max-width: 420px;

            padding: 35px 25px;

            background: #ffffff;

            border: 1px solid #e3e9f1;
            border-radius: 18px;

            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5b8def;
            color: white;

            border-radius: 16px;

            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin-bottom: 10px;

            font-size: 25px;
        }

        p {
            color: #7d899a;

            font-size: 13px;
            line-height: 1.6;
        }

        button {
            margin-top: 22px;

            padding: 12px 22px;

            border: none;
            border-radius: 9px;

            background: #5b8def;
            color: white;

            font-weight: 600;

            cursor: pointer;
        }
    </style>

</head>

<body>

<div class="offline-card">

    <div class="logo">
        S
    </div>

    <h1>
        You're Offline
    </h1>

    <p>
        SmartAttend needs an internet connection
        to access attendance data securely.
    </p>

    <button onclick="window.location.reload()">
        Try Again
    </button>

</div>

</body>

</html>
